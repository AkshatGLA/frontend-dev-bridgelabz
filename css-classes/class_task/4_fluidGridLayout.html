<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluid Grid Example</title>
<style>
* {
box-sizing: border-box;
}
.container {
display: flex;
gap: 10px;
padding: 10px;
}
.box {
background-color: steelblue;
color: white;
text-align: center;
padding: 20px;
width: 33.33%;
/* fluid width */
}
</style>
</head>
<body>
<h2>Fluid Grid Layout</h2>
<div class="container">
<div class="box">Box 1</div>
<div class="box">Box 2</div>
<div class="box">Box 3</div>
</div>
</body>
</html>

Flexible Images:
Images automatically resize with their container while maintaining aspect ratio.
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexible Images</title>
<style>
.wrapper {
width: 80%;
margin: auto;
}
img {
max-width: 100%;
height: auto;
border-radius: 10px;
}
</style>
</head>
<body>
<h2>Flexible Images</h2>
<div class="wrapper">
<img src="https://picsum.photos/800/400" alt="Responsive Image">
</div>
</body>
</html>
