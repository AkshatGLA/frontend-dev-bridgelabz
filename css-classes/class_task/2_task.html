<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tooltip Example</title>
    <style>
      .head {
        display: flex;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      .tooltip {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .tooltip .tooltiptext {
        visibility: hidden;
        width: 180px;
        background-color:khaki;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 5px 0;
        position: absolute;
        z-index: 1;
        bottom: -80%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.3s;
      }

      .tooltip:hover .tooltiptext {
        visibility: visible;
        opacity: 1;
      }

      button {
        font-size: 20px;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>TOOLTIP!</h1>
    </div>

    <div class="tooltip">
      <button>SURPRISE</button>
      <span class="tooltiptext">This is a custom tooltip!</span>
    </div>
  </body>
</html>
