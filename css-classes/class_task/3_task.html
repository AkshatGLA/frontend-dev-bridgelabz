<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <style>
    /* Basic reset and background */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Container for all images */
    .gallery {
      display: grid; /* Using CSS Grid */
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px; /* space between items */
      padding: 20px;
      justify-items: center; /* center each image */
    }

    /* Each image + caption group */
    figure {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
      width: 100%;
      max-width: 350px;
    }

    /* Image styling */
    figure img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    /* Dark overlay effect on hover */
    figure::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
      transition: background 0.3s ease;
      border-radius: 15px;
    }

    /* Hover effect: scale + darken */
    figure:hover img {
      transform: scale(1.1);
      filter: brightness(0.8);
    }

    figure:hover::before {
      background: rgba(0, 0, 0, 0.2);
    }

    /* Caption styling */
    figcaption {
      text-align: center;
      padding: 10px;
      font-weight: bold;
      color: #333;
      background: white;
      border-radius: 0 0 15px 15px;
    }

    /* Responsive: Stack images on small screens */
    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: 1fr; /* 1 image per row */
      }
    }
  </style>
</head>
<body>
  <h2 style="text-align:center; margin-top:20px;">🌆 Image Showcase Gallery</h2>

  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/600/400" alt="Nature 1">
      <figcaption>Mountain View</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1025/600/400" alt="Nature 2">
      <figcaption>Sunny Beach</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1035/600/400" alt="Nature 3">
      <figcaption>Forest Path</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1045/600/400" alt="Nature 4">
      <figcaption>Lake Reflections</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1055/600/400" alt="Nature 5">
      <figcaption>Sunset Horizon</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1065/600/400" alt="Nature 6">
      <figcaption>Snow Peaks</figcaption>
    </figure>
  </div>
</body>
</html>
