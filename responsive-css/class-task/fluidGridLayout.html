<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluid Grid — 3 Equal Boxes (No Wrap)</title>
  <style>
    :root {
      --bg: #f3f6ff;
      --box-bg: #2b6cb0;
      --box-bg-alt: #2c5282;
      --text: #ffffff;
      --gap: 1rem;
      --pad: 1.25rem;
      --radius: 12px;
      --max-width: 1100px;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin: 0 0 1rem 0;
      font-size: 1.25rem;
      color: #0f172a;
    }

    .grid {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: var(--gap);
      flex-wrap: nowrap; /* prevent wrapping */
    }

    .box {
      flex: 1 1 auto;
      padding: var(--pad);
      background: linear-gradient(180deg, var(--box-bg), var(--box-bg-alt));
      color: var(--text);
      border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(10, 20, 40, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .box:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 12px 30px rgba(10, 20, 40, 0.12);
    }

    .box p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fluid Grid — 3 Equal Boxes (No Wrap)</h1>

    <div class="grid">
      <figure class="box">
        <figcaption><p>Box One — Resizes with screen width</p></figcaption>
      </figure>

      <figure class="box">
        <figcaption><p>Box Two — Always stays in the same row</p></figcaption>
      </figure>

      <figure class="box">
        <figcaption><p>Box Three — Adjusts size automatically</p></figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
